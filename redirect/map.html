<!DOCTYPE html>
<html>
<head>
    <title>Hazelwood CRR Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
</head>
<body>
    <div id="map" style="height: 100vh; width: 100%;"></div>
    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 38.79428532868614, lng: -90.38280594367822 },
                zoom: 13
            });

            // Create a link element to open your My Maps directly
            const mapLink = document.createElement('div');
            mapLink.style.backgroundColor = '#fff';
            mapLink.style.padding = '10px';
            mapLink.style.fontFamily = 'Arial,sans-serif';
            mapLink.style.fontSize = '14px';
            mapLink.innerHTML = '<strong>Hazelwood CRR Map</strong><br>' +
                              '<a href="https://www.google.com/maps/d/u/0/viewer?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&ll=38.79428532868614%2C-90.38280594367822&z=13" target="_blank">View Full Map</a>';
            map.controls[google.maps.ControlPosition.BOTTOM_CENTER].push(mapLink);
        }
    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>
