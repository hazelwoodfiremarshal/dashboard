<!DOCTYPE html>
<html>
<head>
<script>
window.onload = function() {
  // Try Chrome first with proper scheme
  const url = "https://www.google.com/maps/d/u/0/edit?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&ll=38.775259661669054%2C-90.36680168827536&z=11";
  
  // Try to open in Chrome using their URL scheme
  window.location.href = "googlechrome://" + url.substring(url.indexOf("//"));
  
  // Fallback to regular browser after 1 second if Chrome doesn't open
  setTimeout(function() {
    window.location.href = url;
  }, 1000);
};
</script>
</head>
<body>
</body>
</html>
