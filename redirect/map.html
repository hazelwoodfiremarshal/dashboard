<!DOCTYPE html>
<html>
<head>
    <title>Hazelwood CRR Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; }
        .map-button {
            display: block;
            width: 100%;
            padding: 20px;
            background-color: #4285f4;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .instructions {
            padding: 20px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <a href="https://www.google.com/maps/d/u/0/viewer?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&ll=38.79428532868614%2C-90.38280594367822&z=13" class="map-button" id="mapLink">
        Open Hazelwood CRR Map
    </a>
    <div class="instructions">
        <p>Click the button above to open the interactive map</p>
        <p>If you're on an iPhone, the map will open in the Google Maps app</p>
    </div>
    <script>
        document.getElementById('mapLink').addEventListener('click', function(e) {
            // Add timestamp to prevent caching issues
            this.href = 'https://www.google.com/maps/d/u/0/viewer?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&ll=38.79428532868614%2C-90.38280594367822&z=13&t=' + Date.now();
        });
    </script>
</body>
</html>
