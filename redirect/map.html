<!DOCTYPE html>
<html>
<head>
<script>
const isiPhone = /iPhone|iPod/.test(navigator.userAgent);
const googleMapsLink = "https://www.google.com/maps/d/u/0/edit?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&ll=38.79431064409568%2C-90.38280594367822&z=13&layer=1";
const iPhoneMapsLink = "https://maps.google.com/maps/d/u/0/edit?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&ll=38.79431064409568%2C-90.38280594367822&z=13&layer=1";

window.onload = function() {
  if (isiPhone) {
    window.location.href = iPhoneMapsLink;
  } else {
    window.location.href = googleMapsLink;
  }
};
</script>
</head>

</body>
