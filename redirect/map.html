<!DOCTYPE html>
<html>
<head>
<script>
window.onload = function() {
  // Direct My Maps link that works on iPhone
  const myMapsLink = "https://www.google.com/maps/d/view?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&z=13";
  
  // Check if iPhone
  if (/iPhone|iPod|iPad/.test(navigator.userAgent)) {
    // For iPhone, use the direct My Maps view URL
    window.location.href = myMapsLink;
  } else {
    // For other devices, use the original edit link
    window.location.href = "https://www.google.com/maps/d/u/0/edit?mid=11ut1FGsnCIWMvHbb3IgU5ZnSynIreww&ll=38.79431064409568%2C-90.38280594367822&z=13&layer=1";
  }
};
</script>
</head>
<body>
</body>
</html>
